apiVersion: v1
kind: ConfigMap
metadata:
  name: order-tracking-config
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
  SPRING_DATASOURCE_USERNAME: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-tracking
spec:
  replicas: 3
  selector:
    matchLabels:
      app: order-tracking
  template:
    metadata:
      labels:
        app: order-tracking
    spec:
      containers:
        - name: order-tracking
          image: order-tracking:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: order-tracking-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-tracking
spec:
  selector:
    app: order-tracking
  ports:
    - port: 80
      targetPort: 8080